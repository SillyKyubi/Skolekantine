<!-- Meny -->
{% extends "base.html" %}

{% block content %}

<div class="meny">
    {% for dag, retter in meny.items() %}
    <section class="dag">
        <h1>{{ dag }}</h1>
        <h2>
            {% for mat in retter %}{{ mat.navn }}<span class="item-pris">{{ mat.pris }},-</span>{% if not loop.last %} &amp; {% endif %}{% endfor %}
        </h2>

        <div class="boxes">
            {% for mat in retter %}
            <img class="item-image {{ 'mat1' if loop.first else 'mat2' }}"
                 src="{{ url_for('static', filename='img/' + mat.image) }}"
                 alt="Du mangler {{ mat.navn }} pls fiks NÅÅÅ ELLER SÅ BLIR DET DENG"
                 title="{{ mat.navn }} - {{ mat.pris }},-">
            {% endfor %}
        </div>
    </section>
    {% endfor %}
</div>

{% endblock %}
