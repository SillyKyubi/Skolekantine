<!-- Meny -->
{% extends "base.html" %}

{% block content %}
    
<div>
    {% for item in varer %}
        <p>{{item}}</p>

        {% for vare in varer[item] %}
         <div class="item">
            <span class="item-navn"> {{ vare.navn }} </span>
            <span class="iten-pris"> {{ vare.pris }} </span>
        </div>

        {%endfor%}

    {% endfor %}
</div>



   


{% endblock %}




<!--
Vis ukens meny (mandag–fredag)
• For hver dag: skriv inn minst én varmrett og en kort beskrivelse

<div class="vare">

            <p class="vare-pris">{{ vare.pris }} kr</p>
