{% extends "base.html" %}

{% block title %}Varer{% endblock %}

{% block content %}

    {% for kategori, produkter in varer.items() %}
    <h2 class="kategori">{{ kategori }}</h2>

    <div class="vare-box">
        {% for vare in produkter %}
        <div class="varer">
            <div class="vare-info">
                <span class="vare-navn">{{ vare.navn }}</span>
                <span class="vare-pris">{{ vare.pris }}kr</span>
            </div>
            <img class="item-image"
                 src="{{ url_for('static', filename='img/' + vare.image) }}"
                 alt="Du mangler {{ vare.navn }} pls fiks NÅÅÅ ELLER SÅ BLIR DET DENG">
        </div>
        {% endfor %}
    </div>
    {% endfor %}

{% endblock %}
