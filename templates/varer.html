{% extends "base.html" %}

{% block title %} Velkommen til resturang c: {% endblock%}


    {% block content %}


    {% for item in varer %}
        <h2> {{item}} </h2>
        {% for vare in varer[item] %}

        <div class="Items">
            <span class="item-navn"> {{ vare.navn }} </span>
            <span class="item-pris"> {{ vare.pris }}kr</span>
        </div>
        <img class= "item-image" src=" {{ url_for('static', filename='img/' + vare.image) }}" alt=" Du mangler {{ vare.navn }} pls fiks NÅÅÅ ELLER SÅ BLIR DET DENG">
        
        {%endfor%}

    {% endfor %}
    {% endblock %}
